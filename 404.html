<script>
/*
 * トルン（HIKARI、2026-10-24）の描き方。正本は docs/design/TORUN_MASCOT.md と
 * TORUTTO/App/DesignSystem/HikariFigure.swift。数値はアプリと同じにする（姿・色・動きをずらさない）。
 *
 *   Hikari.draw(ctx, side, state)   1辺 side の正方形に体を描く（原点は正方形の左上）
 *   Hikari.mount(canvas)            canvas に置く（data-mood="done" / data-look="down" を読む）
 *   Hikari.mountAll(selector)       当てはまる canvas を全部 mount
 *
 * mount の動き: 見えているあいだだけ描く。ふだんは呼吸・まばたき・視線。さわると一度だけ潰れ、
 * 0.8秒以内に3回さわると一回転。data-mood="done" は初めて見えたときに一度だけ跳ねて▶へ傾き、
 * 目を細めて光る（約3秒でふだんへ戻る）。動きを減らす設定では止まった1コマ。
 */
(function (root) {
  'use strict';

  var C = {
    light: 'rgb(255,179,115)',
    body: '#FF7A28',
    deep: 'rgb(227,97,26)',
    eye: 'rgb(41,26,15)',
    rim: 'rgba(184,64,10,0.055)'
  };

  var ROTATION_SECONDS = 3.6;
  var DONE_SECONDS = 3.2;

  function clamp(x, a, b) { return Math.min(Math.max(x, a), b); }
  function ease(x) { var p = clamp(x, 0, 1); return p * p * (3 - 2 * p); }

  function blinkAt(t) {
    var phase = (t % 4.8) / 4.8;
    if (phase <= 0.91 || phase >= 0.97) return 1;
    return Math.abs((phase - 0.91) / 0.06 * 2 - 1) * 0.92 + 0.08;
  }

  function lookAt(t) {
    var phase = (t % 9) / 9;
    if (phase >= 0.44 && phase < 0.70) return 1;
    if (phase >= 0.38 && phase < 0.44) return (phase - 0.38) / 0.06;
    if (phase >= 0.70 && phase < 0.76) return 1 - (phase - 0.70) / 0.06 * 1.6;
    if (phase >= 0.76 && phase < 0.86) return -0.6;
    if (phase >= 0.86 && phase < 0.9) return -0.6 + (phase - 0.86) / 0.04 * 0.6;
    return 0;
  }

  // 一本できたときの▶への傾き（度）。跳ね終わってから90度まで傾き、少し置いて戻る。
  function playTiltAt(age) {
    if (age < 0.75) return 0;
    if (age < 1.2) return 90 * ease((age - 0.75) / 0.45);
    if (age < 2.6) return 90;
    if (age < 3.1) return 90 * (1 - ease((age - 2.6) / 0.5));
    return 0;
  }

  // 丸みのある三角の小石（上が細く、下がふくらむ）。
  function shape(ctx, s) {
    ctx.beginPath();
    ctx.moveTo(s * 0.5, s * 0.08);
    ctx.bezierCurveTo(s * 0.70, s * 0.08, s * 0.93, s * 0.53, s * 0.93, s * 0.72);
    ctx.bezierCurveTo(s * 0.93, s * 0.88, s * 0.77, s * 0.95, s * 0.5, s * 0.95);
    ctx.bezierCurveTo(s * 0.23, s * 0.95, s * 0.07, s * 0.88, s * 0.07, s * 0.72);
    ctx.bezierCurveTo(s * 0.07, s * 0.53, s * 0.30, s * 0.08, s * 0.5, s * 0.08);
    ctx.closePath();
  }

  function eyes(ctx, s, st) {
    var w = s * 0.085;
    ctx.fillStyle = C.eye;
    ctx.strokeStyle = C.eye;
    if (st.face === 'happy' && !st.working) {
      var ew = w * 1.7, eh = s * 0.09, gap = s * 0.099, cy = s * 0.5 + s * 0.08;
      ctx.lineWidth = s * 0.05;
      ctx.lineCap = 'round';
      [-1, 1].forEach(function (k) {
        var cx = s * 0.5 + k * (ew / 2 + gap / 2);
        var x0 = cx - ew / 2, x1 = cx + ew / 2, y0 = cy - eh / 2, y1 = cy + eh / 2;
        ctx.beginPath();
        ctx.moveTo(x0, y1);
        ctx.quadraticCurveTo(cx, y0 - eh * 0.6, x1, y1);
        ctx.stroke();
      });
      return;
    }
    var h = Math.max(s * (st.working ? 0.075 : st.face === 'open' ? 0.22 : 0.18) * blinkAt(st.time), s * 0.02);
    var gap2 = s * 0.11;
    var dx = clamp(st.gaze, -1, 1) * s * 0.03;
    var cy2 = s * 0.5 + s * (st.lookingDown ? 0.13 : 0.06);
    [-1, 1].forEach(function (k) {
      var cx = s * 0.5 + dx + k * (w / 2 + gap2 / 2);
      var r = w / 2, x = cx - w / 2, y = cy2 - h / 2, rr = Math.min(r, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
      ctx.fill();
    });
  }

  /*
   * state: { time, face, working, gaze, lookingDown, done, jump, squish, spin, tilt, breatheWeight }
   * 角度は度。jump・squish は 0〜1。
   */
  function draw(ctx, s, st) {
    var breathe = Math.sin(st.time * 2 * Math.PI / 5.5) * (st.breatheWeight == null ? 1 : st.breatheWeight);

    // 薄い接地影。回っても跳ねても地面に残る（体と一緒に回さない）。
    ctx.save();
    ctx.translate(s * 0.5, s * 0.96);
    ctx.scale(1 - 0.25 * st.jump, (1 - 0.25 * st.jump) * (0.12 / 0.78));
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.36);
    g.addColorStop(0, 'rgba(0,0,0,0.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.39, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (st.done) {
      var glow = ctx.createRadialGradient(s * 0.5, s * 0.5, 0, s * 0.5, s * 0.5, s * 0.65);
      glow.addColorStop(0, 'rgba(255,122,40,0.28)');
      glow.addColorStop(1, 'rgba(255,122,40,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(s * 0.5, s * 0.5, s * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    // 外側から: 跳ね → 中心で回る → 下を支点に潰れる・伸びる → 呼吸
    ctx.translate(0, -s * 0.16 * st.jump);
    ctx.translate(s * 0.5, s * 0.5);
    ctx.rotate((st.spin + st.tilt) * Math.PI / 180);
    ctx.translate(-s * 0.5, -s * 0.5);
    ctx.translate(s * 0.5, s);
    ctx.scale(1 + 0.12 * st.squish, 1 - 0.16 * st.squish);
    ctx.translate(0, -breathe * s * 0.015);
    ctx.rotate(breathe * 2.5 * Math.PI / 180);
    ctx.translate(-s * 0.5, -s);

    var fill = ctx.createRadialGradient(s * 0.38, s * 0.3, 0, s * 0.38, s * 0.3, s * 0.85);
    fill.addColorStop(0, C.light);
    fill.addColorStop(0.5, C.body);
    fill.addColorStop(1, C.deep);
    shape(ctx, s);
    ctx.fillStyle = fill;
    ctx.fill();

    // 縁の陰影: しっとりした半つや。アプリはぼかした線を体で切り抜く。ブラウザ差を避け、
    // 幅の違う薄い線を重ねて同じ見え方にする（縁が濃く、内へなだらかに薄れる）。
    ctx.save();
    shape(ctx, s);
    ctx.clip();
    ctx.strokeStyle = C.rim;
    ctx.lineJoin = 'round';
    for (var k = 0; k < 8; k++) {
      ctx.lineWidth = s * (0.024 + k * 0.028);
      shape(ctx, s);
      ctx.stroke();
    }
    ctx.restore();

    eyes(ctx, s, st);
    ctx.restore();
  }

  function mount(canvas) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return null;
    var reduce = !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var wantsDone = canvas.getAttribute('data-mood') === 'done';
    var lookingDown = canvas.getAttribute('data-look') === 'down';
    var st = { on: false, raf: 0, dead: false, pokedAt: -1, spunAt: -1, pokes: [], doneAt: -1, played: false };
    var t0 = performance.now();
    var now = function () { return (performance.now() - t0) / 1000; };

    function frame() {
      var W = canvas.width, H = canvas.height;
      // 正方形の体を下寄せで置く。上は跳ね、下は接地影のぶんを空ける。
      var s = Math.min(W / 1.15, H / 1.22);
      var t = reduce ? 0 : now();
      var pokeAge = st.pokedAt < 0 ? 1 : t - st.pokedAt;
      var spinAge = st.spunAt < 0 ? Infinity : t - st.spunAt;
      var doneAge = st.doneAt < 0 ? Infinity : t - st.doneAt;
      var done = !reduce && doneAge < DONE_SECONDS;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.translate((W - s) / 2, H - s * 1.04);
      draw(ctx, s, {
        time: t,
        face: done ? 'happy' : 'base',
        working: spinAge < 0.8,
        gaze: reduce ? 0 : lookAt(t),
        lookingDown: lookingDown,
        done: done,
        jump: done && doneAge < 0.7 ? Math.sin(Math.PI * doneAge / 0.7) : 0,
        squish: pokeAge < 0.4 ? Math.sin(Math.PI * Math.max(0, pokeAge) / 0.4) : 0,
        spin: 360 * clamp(spinAge / 0.8, 0, 1) % 360,
        tilt: done ? playTiltAt(doneAge) : 0,
        breatheWeight: 1
      });
    }

    function loop() {
      st.raf = 0;
      if (st.dead) return;
      frame();
      if (!reduce && st.on && !document.hidden) st.raf = requestAnimationFrame(loop);
    }
    function wake() { if (!st.raf && !st.dead) st.raf = requestAnimationFrame(loop); }

    function onDown() {
      if (reduce) return;
      var t = now();
      st.pokedAt = t;
      st.pokes = st.pokes.filter(function (p) { return t - p <= 0.8; });
      st.pokes.push(t);
      if (st.pokes.length >= 3) { st.pokes = []; st.spunAt = t; }
      wake();
    }
    canvas.addEventListener('pointerdown', onDown);

    var io = null;
    if ('IntersectionObserver' in root) {
      io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          st.on = e.isIntersecting;
          // 完成の演技は、半分以上見えたときに一度だけ
          if (wantsDone && !st.played && e.intersectionRatio >= 0.5) { st.played = true; st.doneAt = now(); }
          if (st.on) wake();
        });
      }, { threshold: [0, 0.5] });
      io.observe(canvas);
    } else {
      st.on = true;
    }
    document.addEventListener('visibilitychange', wake);
    frame();
    wake();

    return {
      destroy: function () {
        st.dead = true;
        if (st.raf) cancelAnimationFrame(st.raf);
        if (io) io.disconnect();
        canvas.removeEventListener('pointerdown', onDown);
        document.removeEventListener('visibilitychange', wake);
      }
    };
  }

  function mountAll(selector) {
    return Array.prototype.map.call(document.querySelectorAll(selector), function (c) { return mount(c); });
  }

  root.Hikari = { version: '1.0.0', draw: draw, mount: mount, mountAll: mountAll, blinkAt: blinkAt, colors: C };
})(typeof window !== 'undefined' ? window : this);
Hikari.mountAll('canvas.torun');
</script>
